# Separate install boundary: the Vite app remains on React 18.
packages:
  - '.'
# Keep Tiptap's optional React menu peers on the same engine release.
overrides:
  '@tiptap/extension-bubble-menu': 3.30.5
  '@tiptap/extension-floating-menu': 3.30.5
registries:
  default: https://registry.npmjs.org/
blockExoticSubdeps: true
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
# User-approved 2026-10-14; official source commit verified. See DEPENDENCY-AUDIT.md.
trustPolicyExclude:
  - expo-audio@57.0.5
  - expo-video@57.0.5
  - expo-sharing@57.0.23
  - expo-image-picker@57.0.20
  - expo-document-picker@57.0.3
  - expo-dev-client@57.0.19
  - expo-dev-launcher@57.0.20
  - expo-dev-menu@57.0.19
  - expo-json-utils@57.0.2
  - expo-manifests@57.0.2
  - expo-updates-interface@57.0.2
  - "@expo/cli@57.0.28"
  - "@expo/config-plugins@57.0.10"
  - "@expo/config@57.0.10"
  - "@expo/env@2.4.3"
  - "@expo/fingerprint@0.20.13"
  - "@expo/image-utils@0.11.6"
  - "@expo/inline-modules@0.1.7"
  - "@expo/local-build-cache-provider@57.0.8"
  - "@expo/log-box@57.0.4"
  - "@expo/metro-config@57.0.13"
  - "@expo/metro-file-map@57.0.4"
  - "@expo/metro-runtime@57.0.16"
  - "@expo/prebuild-config@57.0.17"
  - "@expo/require-utils@57.0.6"
  - "@expo/router-server@57.0.12"
  - "@expo/ui@57.0.22"
  - babel-preset-expo@57.0.14
  - expo-asset@57.0.19
  - expo-constants@57.0.21
  - expo-file-system@57.0.7
  - expo-font@57.0.4
  - expo-glass-effect@57.0.4
  - expo-keep-awake@57.0.2
  - expo-linking@57.0.12
  - expo-modules-autolinking@57.0.14
  - expo-modules-core@57.0.21
  - expo-modules-jsi@57.1.1
  - expo-router@57.0.25
  - expo-server@57.0.3
  - expo-symbols@57.0.3
  - expo@57.0.27
trustPolicyIgnoreAfter: 525600
trustLockfile: false
strictDepBuilds: true
allowBuilds: { core-js: false }
