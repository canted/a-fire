- tapOn: Cancel selection
- tapOn:
    text: Close Room details
    index: 0
- tapOn: Open Side Rooms shelf
- assertVisible: Room details
- takeScreenshot: side-rooms-shelf
- tapOn: Room details
- assertVisible: Members
- tapOn:
    text: Close Room details
    index: 0
- tapOn: Add attachment
- assertVisible: Share
- assertVisible: Record audio
- takeScreenshot: attachment-sheet
- tapOn: Cancel
- assertVisible: Message Expo rich content.*
- takeScreenshot: chat-return
