appId: co.canted.afire.preview.localhttps
---
- stopApp
- openLink: ${ROOM_LINK}
- extendedWaitUntil:
    visible: 'Message Expo rich content.*'
    timeout: 20000
- scrollUntilVisible:
    element:
      text: ${EXPECTED_CONTENT}
    direction: DOWN
- assertVisible: ${EXPECTED_CONTENT}
- takeScreenshot: content-attribution
